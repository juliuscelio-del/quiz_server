name: Build Teacher app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  teacher:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: Mac }
          - { os: windows-latest, name: Windows }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no Apple signing certificate
      - uses: actions/upload-artifact@v4
        with:
          name: GNHS-Quiz-Teacher-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
